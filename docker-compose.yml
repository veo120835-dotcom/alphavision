version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alphavision-postgres
    environment:
      POSTGRES_DB: alphavision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alphavision-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: alphavision-api-gateway
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alphavision
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tool Executor Service (Critical)
  tool-executor:
    build:
      context: .
      dockerfile: ./services/tool-executor/Dockerfile
    container_name: alphavision-tool-executor
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alphavision
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web App
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: alphavision-web
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://api-gateway:3000
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  redis-data:
